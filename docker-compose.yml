services:
  # === DEFAULT: GPU server with Web UI ===
  app:
    build: .
    container_name: local-script
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # === CPU-only (no GPU required) ===
  app-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: local-script-cpu
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    profiles:
      - cpu
    restart: unless-stopped

  # === Download model (run once) ===
  download:
    build: .
    container_name: local-script-download
    volumes:
      - ./models:/app/models
    entrypoint: ["python3", "download_model.py"]
    profiles:
      - setup
