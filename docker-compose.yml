services:
  # Ollama — LLM inference server (GPU)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Pull the model (run once after first start)
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    entrypoint: >
      sh -c "sleep 5 && ollama pull qwen2.5-coder:7b-instruct-q4_K_M"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    profiles:
      - setup

  # LocalScript app (CPU only — LLM is in Ollama)
  app:
    build: .
    container_name: local-script
    depends_on:
      - ollama
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b-instruct-q4_K_M
    restart: unless-stopped

volumes:
  ollama_data:
