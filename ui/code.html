<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Synthetix Code</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        bg: "#0a0e1a",
        card: "#111827",
        card2: "#1a2235",
        border: "#1e293b",
        accent: "#818cf8",
        accent2: "#34d399",
        dim: "#64748b",
        err: "#f87171",
      },
      fontFamily: {
        mono: ["JetBrains Mono", "monospace"],
        sans: ["Inter", "sans-serif"],
      }
    }
  }
}
</script>
<style>
  body { background: #0a0e1a; }
  .agent-pulse { animation: pulse-dot 1.5s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100% { opacity:0.4 } 50% { opacity:1 } }
  .fade-in { animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
  textarea:focus { outline: none; }
  pre code { font-family: "JetBrains Mono", monospace; }
  .kw { color: #c084fc; }
  .str { color: #34d399; }
  .num { color: #fbbf24; }
  .cmt { color: #475569; font-style: italic; }
  .fn { color: #60a5fa; }
</style>
</head>
<body class="text-slate-200 font-sans min-h-screen flex flex-col">

<!-- Header -->
<header class="border-b border-border px-6 py-3 flex items-center justify-between flex-shrink-0">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-accent/20 flex items-center justify-center">
      <svg class="w-4 h-4 text-accent" fill="currentColor" viewBox="0 0 20 20"><path d="M12.316 3.051a1 1 0 01.633 1.265l-4 12a1 1 0 11-1.898-.632l4-12a1 1 0 011.265-.633zM5.707 6.293a1 1 0 010 1.414L3.414 10l2.293 2.293a1 1 0 11-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0zm8.586 0a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 01-1.414-1.414L16.586 10l-2.293-2.293a1 1 0 010-1.414z"/></svg>
    </div>
    <span class="text-lg font-bold tracking-tight">Synthetix Code</span>
  </div>
  <div class="flex items-center gap-2 text-xs text-dim font-mono">
    <span id="health-dot" class="w-2 h-2 rounded-full bg-dim"></span>
    <span id="health-text">connecting...</span>
  </div>
</header>

<!-- Main Content -->
<main class="flex-1 max-w-4xl w-full mx-auto px-6 py-8 flex flex-col gap-6">

  <!-- Input -->
  <div class="bg-card rounded-xl border border-border overflow-hidden">
    <textarea id="task-input" rows="3" class="w-full bg-transparent text-slate-200 placeholder:text-dim p-4 resize-none font-sans text-sm leading-relaxed" placeholder="Describe your Lua task... (Cmd+Enter to generate)"></textarea>
    <div class="flex items-center justify-between px-4 pb-3">
      <span class="text-[10px] text-dim font-mono uppercase tracking-wider">Multi-Agent Pipeline</span>
      <button id="gen-btn" class="bg-accent hover:bg-accent/80 text-white text-sm font-semibold py-2 px-5 rounded-lg transition-all flex items-center gap-2">
        Generate
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
      </button>
    </div>
  </div>

  <!-- Agent Pipeline (horizontal steps) -->
  <div id="pipeline" class="hidden bg-card rounded-xl border border-border p-4">
    <div class="flex items-center justify-between gap-1 overflow-x-auto">
      <div class="agent-step flex flex-col items-center gap-1 min-w-[70px]" data-agent="rag">
        <div class="w-9 h-9 rounded-lg bg-slate-800 border border-border flex items-center justify-center text-dim text-xs font-bold">RAG</div>
        <span class="text-[9px] text-dim font-mono">Search</span>
      </div>
      <div class="text-dim text-xs">&#8594;</div>
      <div class="agent-step flex flex-col items-center gap-1 min-w-[70px]" data-agent="planner">
        <div class="w-9 h-9 rounded-lg bg-slate-800 border border-border flex items-center justify-center text-dim text-xs font-bold">PLN</div>
        <span class="text-[9px] text-dim font-mono">Plan</span>
      </div>
      <div class="text-dim text-xs">&#8594;</div>
      <div class="agent-step flex flex-col items-center gap-1 min-w-[70px]" data-agent="coder">
        <div class="w-9 h-9 rounded-lg bg-slate-800 border border-border flex items-center justify-center text-dim text-xs font-bold">COD</div>
        <span class="text-[9px] text-dim font-mono">Code</span>
      </div>
      <div class="text-dim text-xs">&#8594;</div>
      <div class="agent-step flex flex-col items-center gap-1 min-w-[70px]" data-agent="linter">
        <div class="w-9 h-9 rounded-lg bg-slate-800 border border-border flex items-center justify-center text-dim text-xs font-bold">LNT</div>
        <span class="text-[9px] text-dim font-mono">Lint</span>
      </div>
      <div class="text-dim text-xs">&#8594;</div>
      <div class="agent-step flex flex-col items-center gap-1 min-w-[70px]" data-agent="tester">
        <div class="w-9 h-9 rounded-lg bg-slate-800 border border-border flex items-center justify-center text-dim text-xs font-bold">TST</div>
        <span class="text-[9px] text-dim font-mono">Test</span>
      </div>
      <div class="text-dim text-xs">&#8594;</div>
      <div class="agent-step flex flex-col items-center gap-1 min-w-[70px]" data-agent="executor">
        <div class="w-9 h-9 rounded-lg bg-slate-800 border border-border flex items-center justify-center text-dim text-xs font-bold">RUN</div>
        <span class="text-[9px] text-dim font-mono">Execute</span>
      </div>
      <div class="text-dim text-xs">&#8594;</div>
      <div class="agent-step flex flex-col items-center gap-1 min-w-[70px]" data-agent="critic">
        <div class="w-9 h-9 rounded-lg bg-slate-800 border border-border flex items-center justify-center text-dim text-xs font-bold">CRT</div>
        <span class="text-[9px] text-dim font-mono">Critic</span>
      </div>
    </div>
    <!-- Current agent message -->
    <div id="agent-msg" class="mt-3 text-xs text-dim font-mono truncate hidden"></div>
  </div>

  <!-- Log (compact, max 6 lines) -->
  <div id="log-box" class="hidden bg-card2 rounded-xl border border-border p-3 font-mono text-xs max-h-[160px] overflow-y-auto space-y-1">
  </div>

  <!-- Code Output -->
  <div id="code-section" class="hidden flex flex-col gap-2">
    <!-- Status bar -->
    <div id="result-bar" class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span id="result-badge" class="text-xs font-bold px-3 py-1 rounded-full"></span>
        <span id="result-meta" class="text-xs text-dim font-mono"></span>
      </div>
      <button id="copy-btn" class="text-xs text-dim hover:text-slate-200 font-mono border border-border rounded px-3 py-1 hover:bg-card transition-colors">Copy</button>
    </div>
    <!-- Editor -->
    <div class="bg-card rounded-xl border border-border overflow-hidden">
      <div class="bg-card2 px-4 py-2 flex items-center justify-between border-b border-border">
        <div class="flex items-center gap-2">
          <div class="flex gap-1.5">
            <div class="w-2.5 h-2.5 rounded-full bg-red-500/80"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-yellow-500/80"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-green-500/80"></div>
          </div>
          <span id="file-tab" class="ml-3 text-[11px] font-mono text-dim">output.lua</span>
        </div>
        <span class="text-[10px] font-mono text-dim">Lua 5.4</span>
      </div>
      <pre id="code-output" class="p-5 font-mono text-sm leading-relaxed overflow-x-auto min-h-[120px] max-h-[400px] overflow-y-auto"><code class="text-dim">-- Your code will appear here</code></pre>
    </div>
  </div>

  <!-- Tests Output (compact) -->
  <div id="tests-section" class="hidden">
    <details class="bg-card rounded-xl border border-border overflow-hidden">
      <summary class="px-4 py-3 text-xs font-semibold cursor-pointer hover:bg-card2 transition-colors flex items-center gap-2">
        <span id="tests-icon">&#9654;</span> Test Results <span id="tests-count" class="text-dim font-mono ml-auto"></span>
      </summary>
      <div id="tests-output" class="px-4 pb-3 font-mono text-xs space-y-1"></div>
    </details>
  </div>

</main>

<script>
(function() {
  const input = document.getElementById('task-input');
  const genBtn = document.getElementById('gen-btn');
  const pipeline = document.getElementById('pipeline');
  const agentMsg = document.getElementById('agent-msg');
  const logBox = document.getElementById('log-box');
  const codeSection = document.getElementById('code-section');
  const codeOutput = document.getElementById('code-output');
  const resultBadge = document.getElementById('result-badge');
  const resultMeta = document.getElementById('result-meta');
  const copyBtn = document.getElementById('copy-btn');
  const testsSection = document.getElementById('tests-section');
  const testsOutput = document.getElementById('tests-output');
  const testsCount = document.getElementById('tests-count');
  const healthDot = document.getElementById('health-dot');
  const healthText = document.getElementById('health-text');

  let rawCode = '';
  const testResults = [];

  // Health check
  fetch('/health').then(r => r.json()).then(d => {
    healthDot.className = 'w-2 h-2 rounded-full bg-accent2';
    healthText.textContent = `${d.rag_entries} patterns | Lua ${d.lua_available ? 'ready' : 'missing'}`;
  }).catch(() => {
    healthDot.className = 'w-2 h-2 rounded-full bg-err';
    healthText.textContent = 'offline';
  });

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function highlightLua(code) {
    return code.split('\n').map((line, i) => {
      let h = esc(line);
      // Comments first
      h = h.replace(/(--.*$)/, '<span class="cmt">$1</span>');
      // Strings
      h = h.replace(/(&quot;(?:[^&]|\\.)*?&quot;|'(?:[^'\\]|\\.)*?'|\[\[[\s\S]*?\]\])/g, '<span class="str">$1</span>');
      // Keywords
      h = h.replace(/\b(local|function|end|if|then|else|elseif|for|while|do|return|in|repeat|until|and|or|not|nil|true|false)\b/g, '<span class="kw">$1</span>');
      // Numbers
      h = h.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
      const ln = String(i + 1).padStart(3, ' ');
      return `<span class="text-slate-600 select-none">${ln}</span>  ${h}`;
    }).join('\n');
  }

  function activateAgent(name) {
    document.querySelectorAll('.agent-step').forEach(el => {
      const box = el.querySelector('div');
      if (el.dataset.agent === name) {
        box.className = 'w-9 h-9 rounded-lg bg-accent/20 border border-accent flex items-center justify-center text-accent text-xs font-bold agent-pulse';
      } else if (box.classList.contains('bg-accent2/20')) {
        // already done, keep
      } else {
        box.className = 'w-9 h-9 rounded-lg bg-slate-800 border border-border flex items-center justify-center text-dim text-xs font-bold';
      }
    });
  }

  function completeAgent(name) {
    const el = document.querySelector(`.agent-step[data-agent="${name}"] div`);
    if (el) el.className = 'w-9 h-9 rounded-lg bg-accent2/20 border border-accent2 flex items-center justify-center text-accent2 text-xs font-bold';
  }

  function addLog(msg, type) {
    const div = document.createElement('div');
    div.className = 'fade-in';
    const color = type === 'pass' ? 'text-accent2' : type === 'fail' ? 'text-err' : type === 'agent' ? 'text-accent' : 'text-dim';
    div.innerHTML = `<span class="${color}">${esc(msg)}</span>`;
    logBox.appendChild(div);
    // Keep only last 8 entries
    while (logBox.children.length > 8) logBox.removeChild(logBox.firstChild);
    logBox.scrollTop = logBox.scrollHeight;
  }

  let prevAgent = null;

  async function handleGenerate() {
    const task = input.value.trim();
    if (!task) { input.focus(); return; }

    // Reset UI
    genBtn.disabled = true;
    genBtn.innerHTML = '<span class="agent-pulse">&#9679;</span> Generating...';
    pipeline.classList.remove('hidden');
    logBox.classList.remove('hidden');
    logBox.innerHTML = '';
    codeSection.classList.add('hidden');
    testsSection.classList.add('hidden');
    testsOutput.innerHTML = '';
    testResults.length = 0;
    rawCode = '';
    prevAgent = null;
    agentMsg.classList.remove('hidden');
    agentMsg.textContent = 'Starting pipeline...';

    // Reset all agent steps
    document.querySelectorAll('.agent-step div').forEach(el => {
      el.className = 'w-9 h-9 rounded-lg bg-slate-800 border border-border flex items-center justify-center text-dim text-xs font-bold';
    });

    try {
      const resp = await fetch('/solve/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop() || '';

        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          try {
            const ev = JSON.parse(part.slice(6));

            if (ev.agent === 'done') {
              rawCode = ev.code || '';
              codeSection.classList.remove('hidden');
              codeOutput.innerHTML = `<code>${highlightLua(rawCode)}</code>`;

              const ok = ev.status === 'SUCCESS';
              resultBadge.textContent = ev.status;
              resultBadge.className = `text-xs font-bold px-3 py-1 rounded-full ${ok ? 'bg-accent2/20 text-accent2' : 'bg-err/20 text-err'}`;
              resultMeta.textContent = `${ev.tts}s | ${ev.iterations} iteration${ev.iterations !== 1 ? 's' : ''}`;

              // Show tests
              if (testResults.length > 0) {
                testsSection.classList.remove('hidden');
                const passed = testResults.filter(t => t.pass).length;
                testsCount.textContent = `${passed}/${testResults.length} passed`;
                testResults.forEach(t => {
                  const d = document.createElement('div');
                  d.className = t.pass ? 'text-accent2' : 'text-err';
                  d.textContent = t.msg;
                  testsOutput.appendChild(d);
                });
              }

              agentMsg.textContent = `Done: ${ev.status} in ${ev.tts}s`;

              // Mark all agents done on success
              if (ok) {
                document.querySelectorAll('.agent-step div').forEach(el => {
                  el.className = 'w-9 h-9 rounded-lg bg-accent2/20 border border-accent2 flex items-center justify-center text-accent2 text-xs font-bold';
                });
              }

            } else if (ev.agent === 'error') {
              addLog('Error: ' + ev.message, 'fail');
            } else if (ev.agent === 'test_result') {
              const pass = ev.message.includes('[PASS]');
              testResults.push({ pass, msg: ev.message });
              addLog(ev.message, pass ? 'pass' : 'fail');
            } else {
              // Agent event
              const agentName = ev.agent;
              if (prevAgent && prevAgent !== agentName) completeAgent(prevAgent);
              activateAgent(agentName);
              prevAgent = agentName;

              const cleanMsg = ev.message.replace(/^[\s\S]*?\]\s*/, '');
              agentMsg.textContent = cleanMsg;
              addLog(ev.message, 'agent');
            }
          } catch(e) {}
        }
      }
    } catch(err) {
      addLog('Connection error: ' + err.message, 'fail');
    } finally {
      genBtn.disabled = false;
      genBtn.innerHTML = 'Generate <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>';
    }
  }

  genBtn.addEventListener('click', handleGenerate);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); handleGenerate(); }
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(rawCode).then(() => {
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
    });
  });
})();
</script>
</body>
</html>
